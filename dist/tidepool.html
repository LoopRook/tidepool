<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="An artificial-life tide pool: creatures with genomes and tiny brains evolve into named species.">
<title>Tidepool</title>
<style>
:root {
  --bg: #03141a;
  --bg-2: #062029;
  --glass: rgba(14, 44, 52, 0.58);
  --glass-hi: rgba(26, 70, 78, 0.55);
  --line: rgba(160, 230, 220, 0.09);
  --line-2: rgba(160, 230, 220, 0.18);
  --ink: #dcefea;
  --ink-2: #9dbdb8;
  --ink-3: #6c8f8b;
  --accent: #ffd59a;     /* sunlight */
  --accent-2: #8fe3cf;   /* sea glass */
  --danger: #ff9b86;
  --pos: #f2b867;
  --neg: #6fcde8;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  --panel-w: 380px;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body { height: 100%; margin: 0; }

body {
  background: radial-gradient(120% 90% at 30% 0%, #0a2f38 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--panel-w);
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}

/* ---------- header ---------- */

.bar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 12px 28px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(8, 34, 42, 0.95), rgba(4, 22, 28, 0.9));
  flex-wrap: wrap;
}

.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 {
  margin: 0;
  font: 600 22px/1 var(--serif);
  letter-spacing: 0.01em;
  color: var(--accent);
  text-shadow: 0 0 18px rgba(255, 200, 120, 0.25);
}
.brand .sub { margin: 0; color: var(--ink-3); font-size: 13px; font-style: italic; font-family: var(--serif); }

.stats { display: flex; gap: 18px; margin: 0; }
.stats div { display: flex; flex-direction: column; gap: 1px; }
.stats dt { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.stats dd { margin: 0; font: 500 14px/1.2 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }

.controls { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }

.btn, .seg button {
  appearance: none;
  font: 500 13px/1 var(--sans);
  color: var(--ink);
  background: var(--glass);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  height: 32px;
  padding: 0 12px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.btn:hover, .seg button:hover { background: var(--glass-hi); border-color: rgba(160, 230, 220, 0.3); }
.btn:focus-visible, .seg button:focus-visible, .guide li:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.btn.play { width: 38px; padding: 0; display: grid; place-items: center; color: var(--accent); }
.btn.play svg { width: 16px; height: 16px; fill: currentColor; }
.btn.play .i-play { display: none; }
.paused .btn.play .i-play { display: block; }
.paused .btn.play .i-pause { display: none; }
.btn.toggle[aria-pressed="true"] { background: rgba(143, 227, 207, 0.16); border-color: rgba(143, 227, 207, 0.55); color: var(--accent-2); }

.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; font-family: var(--mono); font-size: 12px; padding: 0 10px; }
.seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
.seg button:last-child { border-radius: 0 8px 8px 0; }
.seg button.on { background: rgba(255, 213, 154, 0.16); border-color: rgba(255, 213, 154, 0.5); color: var(--accent); position: relative; }
.eff { font: 12px var(--mono); color: var(--ink-3); min-width: 3.5em; }

/* ---------- stage ---------- */

.stage { position: relative; min-width: 0; min-height: 0; background: #020d12; overflow: hidden; }
#pool { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#pool.dragging { cursor: grabbing; }
#pool.over { cursor: pointer; }
.hint {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  margin: 0; padding: 6px 12px; border-radius: 999px;
  background: rgba(2, 18, 24, 0.6); border: 1px solid var(--line);
  color: var(--ink-2); font-size: 12px; white-space: nowrap; pointer-events: none;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: opacity 0.8s;
}
.hint.gone { opacity: 0; }
.paused-badge {
  position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 6px;
  font: 600 11px/1.4 var(--sans); letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--accent); background: rgba(2, 18, 24, 0.65); border: 1px solid rgba(255, 213, 154, 0.3);
  display: none; pointer-events: none;
}
.paused .paused-badge { display: block; }

/* ---------- side panel ---------- */

.panel {
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  border-left: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(6, 30, 38, 0.92), rgba(3, 18, 24, 0.96));
  scrollbar-width: thin;
  scrollbar-color: rgba(160, 230, 220, 0.2) transparent;
}

.card {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 8px 24px rgba(0, 0, 0, 0.18);
  min-width: 0;
}
.card h2 {
  margin: 0 0 10px;
  font: 600 11px/1 var(--sans);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  display: flex; align-items: baseline; gap: 8px;
}
.card h2 .count { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink-3); }

/* inspector */
.inspector .empty { color: var(--ink-3); margin: 2px 0 2px; font-family: var(--serif); font-style: italic; font-size: 15px; }
.inspector .empty b { display: block; font-style: normal; color: var(--ink-2); font-family: var(--sans); font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.ins-head { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: center; }
.ins-head canvas { width: 72px; height: 52px; border-radius: 8px; background: radial-gradient(circle at 50% 45%, rgba(40, 110, 110, 0.55), rgba(6, 30, 40, 0.6)); }
.ins-names { min-width: 0; }
.common { font: 600 18px/1.2 var(--serif); color: var(--ink); overflow-wrap: anywhere; }
.latin { font: italic 14px/1.3 var(--serif); color: var(--ink-2); overflow-wrap: anywhere; }
.meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.tag {
  display: inline-block; font: 600 10px/1 var(--sans); letter-spacing: 0.08em; text-transform: uppercase;
  padding: 3px 6px; border-radius: 4px; margin-right: 6px; vertical-align: 1px;
  background: rgba(143, 227, 207, 0.12); color: var(--accent-2);
}
.tag.predator { background: rgba(255, 155, 134, 0.14); color: var(--danger); }
.tag.omnivore { background: rgba(255, 213, 154, 0.14); color: var(--accent); }
.tag.dead { background: rgba(255, 155, 134, 0.2); color: var(--danger); }
.inspector.deceased .ins-body { opacity: 0.55; filter: saturate(0.4); }

.energy { margin: 12px 0 10px; }
.energy .lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); margin-bottom: 4px; letter-spacing: 0.04em; }
.energy .lbl b { font: 500 11px var(--mono); color: var(--ink-2); }
.bar-track { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
.bar-fill { height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, #6fcf97, #c9e86f); transition: width 0.25s; }
.bar-fill.low { background: linear-gradient(90deg, #ff8a6b, #ffc36b); }
.bar-mark { position: relative; }

.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 10px; margin: 0; }
.grid div { min-width: 0; }
.grid dt { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.grid dd { margin: 0; font: 500 13px/1.3 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.brain-wrap { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.brain-wrap .lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); margin-bottom: 4px; }
.brain-wrap .lbl i { font-style: normal; }
.brain-wrap .lbl .k-pos { color: var(--pos); }
.brain-wrap .lbl .k-neg { color: var(--neg); }
.brain { width: 100%; height: 220px; display: block; }

.deceased-note { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: rgba(255, 155, 134, 0.08); border: 1px solid rgba(255, 155, 134, 0.22); font-family: var(--serif); font-size: 14px; color: var(--ink-2); }
.deceased-note .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.deceased-note .btn { height: 28px; font-size: 12px; }

/* chart */
.chart-wrap { position: relative; height: 128px; }
#chart { width: 100%; height: 100%; display: block; }
.chart-axis { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--ink-3); margin-top: 4px; }

/* field guide */
.guide { list-style: none; margin: 0 -6px; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.guide li {
  display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 5px 6px; border-radius: 8px; cursor: pointer; transition: background 0.15s;
}
.guide li:hover { background: rgba(160, 230, 220, 0.06); }
.guide li.current { background: rgba(255, 213, 154, 0.08); box-shadow: inset 2px 0 0 var(--accent); }
.guide li.extinct { cursor: default; opacity: 0.5; }
.guide li.extinct:hover { background: none; }
.guide canvas { width: 54px; height: 36px; display: block; }
.guide .nm { min-width: 0; }
.guide .common { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.guide .latin { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.guide .pop { text-align: right; font: 500 13px/1.2 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.guide .pop small { display: block; font: 10px/1.3 var(--sans); color: var(--ink-3); white-space: nowrap; }
.guide .swatch { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.guide .more { cursor: default; display: block; color: var(--ink-3); font-size: 12px; padding: 6px; }
.guide .more:hover { background: none; }

/* journal */
.journal { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; scrollbar-width: thin; }
.journal li { font: 15px/1.5 var(--serif); color: var(--ink); padding-left: 12px; border-left: 2px solid rgba(255, 213, 154, 0.18); }
.journal li .day { font-variant: small-caps; letter-spacing: 0.04em; color: var(--accent); }
.journal li.fresh { animation: ink 1.2s ease-out; }
.journal li.t-speciation { border-left-color: rgba(143, 227, 207, 0.5); }
.journal li.t-extinction { border-left-color: rgba(255, 155, 134, 0.5); }
.journal .empty { color: var(--ink-3); font-style: italic; border: 0; padding: 0; font-size: 14px; }
@keyframes ink { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* ---------- narrow screens: panel below the pool ---------- */

@media (max-width: 799px) {
  body { overflow-x: hidden; overflow-y: auto; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; height: auto; min-height: 100vh; }
  /* the pool is landscape, so size the stage by width rather than wasting a tall box */
  .stage { aspect-ratio: 1.4; min-height: 240px; max-height: 70vh; }
  .panel { overflow: visible; border-left: 0; border-top: 1px solid var(--line); padding: 12px 16px 24px; }
  .bar { gap: 8px 16px; padding: 10px 16px; }
  .brand .sub { display: none; }
  .stats { gap: 12px; flex-wrap: wrap; }
  .controls { margin-left: 0; width: 100%; }
  .hint { font-size: 11px; }
  .journal { max-height: none; }
}

@media (prefers-reduced-motion: reduce) {
  .journal li.fresh { animation: none; }
  .bar-fill { transition: none; }
}

</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>Tidepool</h1>
      <p class="sub">Tiny-brained creatures evolving in a sunlit pool</p>
    </div>
    <dl class="stats" aria-live="off">
      <div><dt>Day</dt><dd id="stat-day">0</dd></div>
      <div><dt>Tick</dt><dd id="stat-tick">0</dd></div>
      <div><dt>Alive</dt><dd id="stat-pop">0</dd></div>
      <div><dt>Species</dt><dd id="stat-species">0</dd></div>
      <div><dt>Seed</dt><dd id="stat-seed">-</dd></div>
    </dl>
    <div class="controls">
      <button type="button" id="btn-play" class="btn play" title="Pause (Space)" aria-label="Pause">
        <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3" width="3" height="10" rx="1"/><rect x="9.5" y="3" width="3" height="10" rx="1"/></svg>
        <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6a.6.6 0 0 0 .9.5l7.6-4.8a.6.6 0 0 0 0-1L5.9 2.7a.6.6 0 0 0-.9.5z"/></svg>
      </button>
      <div class="seg" id="speed" role="group" aria-label="Simulation speed">
        <button type="button" data-speed="1" class="on" title="1x (key 1)">1&times;</button>
        <button type="button" data-speed="4" title="4x (key 2)">4&times;</button>
        <button type="button" data-speed="16" title="16x (key 3)">16&times;</button>
        <button type="button" data-speed="64" title="64x (key 4)">64&times;</button>
      </div>
      <span class="eff" id="stat-eff" title="Actual speed (stepping is capped to keep the page responsive)"></span>
      <button type="button" id="btn-follow" class="btn toggle" aria-pressed="false" title="Keep the selected creature centred (F)">Follow</button>
      <button type="button" id="btn-fit" class="btn" title="Show the whole pool (0)">Fit</button>
      <button type="button" id="btn-sound" class="btn toggle" aria-pressed="false" title="Let the pool make sound (M)">Sound</button>
      <button type="button" id="btn-seed" class="btn" title="Start a new pool with a fresh seed (N)">New seed</button>
    </div>
  </header>

  <main class="stage">
    <canvas id="pool" aria-label="The tide pool. Drag to pan, scroll to zoom, click a creature to inspect it."></canvas>
    <div class="paused-badge">Paused</div>
    <p class="hint" id="hint">Drag to pan &middot; scroll to zoom &middot; click a creature</p>
  </main>

  <aside class="panel">
    <section class="card inspector" id="inspector" aria-label="Inspector"></section>
    <section class="card">
      <h2>Population</h2>
      <div class="chart-wrap"><canvas id="chart" aria-label="Population by species over time"></canvas></div>
      <div class="chart-axis"><span id="chart-start"></span><span id="chart-max"></span><span id="chart-end"></span></div>
    </section>
    <section class="card">
      <h2>Field guide <span class="count" id="guide-count"></span></h2>
      <ul class="guide" id="guide"></ul>
    </section>
    <section class="card">
      <h2>Journal</h2>
      <ol class="journal" id="journal"></ol>
    </section>
  </aside>
</div>
<script>
(() => {
'use strict';
const __m2 = (() => {

// Seeded PRNG (mulberry32). Every source of randomness in the simulation goes
// through one of these so a seed reproduces a whole world exactly.

function makeRng(seed) {
  let s = (seed >>> 0) || 0x9e3779b9;
  const next = () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  let spare = null;
  return {
    next,
    // integer in [0, n)
    int: (n) => Math.floor(next() * n),
    // float in [a, b)
    range: (a, b) => a + (b - a) * next(),
    chance: (p) => next() < p,
    pick: (arr) => arr[Math.floor(next() * arr.length)],
    // standard normal via Box-Muller
    gauss() {
      if (spare !== null) { const v = spare; spare = null; return v; }
      let u = 0, v = 0;
      while (u === 0) u = next();
      while (v === 0) v = next();
      const m = Math.sqrt(-2 * Math.log(u));
      spare = m * Math.sin(2 * Math.PI * v);
      return m * Math.cos(2 * Math.PI * v);
    },
    // independent child stream, deterministic given this stream's state
    fork: () => makeRng(Math.floor(next() * 4294967296)),
    get state() { return s; },
  };
}

return { makeRng };
})();

const __m4 = (() => {

// Tiny feed-forward brain: inputs -> tanh hidden layer -> 3 outputs.
// Weight layout (flat array, so genomes stay JSON-friendly):
//   [0, H*I)            input->hidden, hidden j uses w[j*I + i] (the `bias` input is the hidden bias)
//   [H*I, H*I + O*(H+1)) hidden->output, output o uses w[H*I + o*(H+1) + j], j = H is its bias

const INPUTS = [
  'foodAngle', 'foodDist',
  'preyAngle', 'preyDist',
  'threatAngle', 'threatDist',
  'kinAngle', 'kinDist',
  'energy', 'wall', 'clock', 'bias',
];
const OUTPUTS = ['turn', 'thrust', 'bite'];
const HIDDEN = 8;

const NI = INPUTS.length;
const NO = OUTPUTS.length;
const OUT_BASE = HIDDEN * NI;

function weightCount() {
  return HIDDEN * NI + NO * (HIDDEN + 1);
}

// Index helpers so genome.js can build a behavioural prior without knowing the layout.
function hiddenWeightIndex(hidden, input) {
  return hidden * NI + input;
}

function outputWeightIndex(output, hidden) {
  // hidden === HIDDEN addresses the output's bias
  return OUT_BASE + output * (HIDDEN + 1) + hidden;
}

function makeBrain(weights) {
  const w = Float64Array.from(weights);
  const h = new Float64Array(HIDDEN);
  const out = [0, 0, 0];
  return {
    // Returns the same array every call (no per-call allocation); copy if you keep it.
    think(inputs) {
      for (let j = 0; j < HIDDEN; j++) {
        let s = 0;
        const base = j * NI;
        for (let i = 0; i < NI; i++) s += w[base + i] * inputs[i];
        h[j] = Math.tanh(s);
      }
      for (let o = 0; o < NO; o++) {
        const base = OUT_BASE + o * (HIDDEN + 1);
        let s = w[base + HIDDEN];
        for (let j = 0; j < HIDDEN; j++) s += w[base + j] * h[j];
        // turn is signed; thrust and bite are squashed into [0, 1]
        out[o] = o === 0 ? Math.tanh(s) : 0.5 + 0.5 * Math.tanh(s);
      }
      return out;
    },
  };
}

return { INPUTS, OUTPUTS, HIDDEN, weightCount, hiddenWeightIndex, outputWeightIndex, makeBrain };
})();

const __m3 = (() => {
const { weightCount, hiddenWeightIndex, outputWeightIndex, INPUTS, HIDDEN } = __m4;
// Genome = visible/body traits in [0,1] + brain weights. Phenotype is derived
// deterministically, so the genome is the only thing that needs to be stored.
const TRAITS = [
  'size', 'speed', 'sense', 'hue', 'saturation', 'lightness', 'diet', 'fins',
  'aspect', 'pattern', 'patternHue', 'tail', 'fertility', 'brood', 'longevity',
];

const PATTERN_NAMES = ['plain', 'spots', 'stripes', 'bands'];

// How much each trait counts toward species distance. Visible traits dominate.
const TRAIT_WEIGHT = {
  size: 1.6, speed: 1.0, sense: 0.6, hue: 2.4, saturation: 0.8, lightness: 0.8,
  diet: 1.4, fins: 1.0, aspect: 1.0, pattern: 1.0, patternHue: 1.2, tail: 0.8,
  fertility: 0.4, brood: 0.4, longevity: 0.4,
};
const CIRCULAR = { hue: true, patternHue: true };
const TRAIT_SHARE = 0.92; // remaining share comes from brain weights
const WEIGHT_SCALE = 0.6; // mean |dw| that counts as "completely different brain"
const WEIGHT_LIMIT = 5;

let weightTotal = 0;
for (const t of TRAITS) weightTotal += TRAIT_WEIGHT[t];

const IN = {};
INPUTS.forEach((name, i) => { IN[name] = i; });

// Hand-built behavioural prior: turn toward food, chase prey if carnivorous,
// flee threats, steer off walls, keep moving. Noise on top gives variety.
function priorWeights(rng, diet) {
  const w = new Array(weightCount()).fill(0);
  const H = (h, input, v) => { w[hiddenWeightIndex(h, IN[input])] = v; };
  const O = (o, h, v) => { w[outputWeightIndex(o, h)] = v; };
  // h0: food direction -> turn (grazers care more)
  H(0, 'foodAngle', 3); O(0, 0, 2.2 * (1 - 0.6 * diet));
  // h1: prey direction -> turn (carnivores)
  H(1, 'preyAngle', 3); O(0, 1, 2.4 * diet);
  // h2: prey close -> bite
  H(2, 'preyDist', 3); O(2, 2, 4 * diet);
  // h3: threat direction -> turn away; h4 also speeds up when threatened
  H(3, 'threatAngle', -3); O(0, 3, 1.6);

// A daughter species is worth a line once it has this many births or this census peak.
const ESTABLISHED_BORN = 8;
const ESTABLISHED_PEAK = 5;

// Per-world memory (which prey have been taken, records broken, ...).
const memos = new WeakMap();
const orphanMemo = freshMemo();

function freshMemo() {
  return {
    announced: new Set(),     // daughter species already introduced
    preySeen: new Set(),
    predatorSeen: new Set(),
    cannibalSeen: new Set(),
    anyKill: false,
    speciations: 0,           // announced so far
    milestones: new Map(),    // speciesId -> highest milestone narrated
    oldAgeRecord: 0,
    oldAgeRecordTick: -Infinity,
    oldAgeCount: 0,
    maxAgeSeen: 0,
    nextKillMark: 0,          // index into KILL_MARKS
    nextGeneration: 0,        // index into GENERATIONS
    highs: new Map(),         // speciesId -> { pop, tick } recent high-water mark
    ephemeral: 0,             // unremarked extinctions since the last summary
    ephemeralTick: 0,
    restockTick: -1,
    firstsTick: -Infinity,    // last "first kill/loss" line, to keep them from crowding the page
  };
}

function memoFor(world) {
  if (!world || typeof world !== 'object') return orphanMemo;
  let m = memos.get(world);
  if (!m) { m = freshMemo(); memos.set(world, m); }
  return m;
}

// ---------- small text helpers ----------

  h = Math.imul(h ^ (h >>> 13), 0x45d9f3b);
  return (h ^ (h >>> 16)) >>> 0;
}

function choose(event, salt, options) {
  return options[hashEvent(event, salt) % options.length];

const capFirst = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const dayOf = (tick) => Math.floor((tick || 0) / TICKS_PER_DAY) + 1;
const article = (word) => ('AEIOUaeiou'.includes(word.charAt(0)) ? 'an' : 'a');
const withArticle = (word) => article(word) + ' ' + word;

const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten',

function duration(ticks) {

  if (days < 1) return 'less than a day';
  const d = Math.round(days);
  return d === 1 ? 'a single day' : numberWord(d) + ' days';

// Pluralise the noun of a common name: Dartfin -> Dartfins, Goby -> Gobies,

// ---------- species lookups that never throw ----------
function speciesOf(world, id) {
  try {
    const reg = world && world.species;
    if (reg && typeof reg.get === 'function' && id != null) return reg.get(id) || null;
  } catch (e) { /* a broken registry should not take the journal down */ }
  return null;
}

function allSpecies(world) {
  try {
    const reg = world && world.species;
    if (reg && typeof reg.all === 'function') return reg.all() || [];
  } catch (e) { /* see above */ }

function latinOf(sp) {
  const n = nameOf(sp);
  return n ? n.latin : 'incertae sedis';
}
function commonOf(sp) {
  const n = nameOf(sp);
  return n ? n.common : 'unrecorded creature';
}
function commonPlural(sp) {
  const n = nameOf(sp);
  return n ? plural(n.common) : 'unrecorded creatures';
}
// "the Banded Glimmerfin (Lucipinna fasciata)"

// "the Banded Glimmerfins (Lucipinna fasciata)"

  return nameOf(sp) ? `the ${commonPlural(sp)} (${latinOf(sp)})` : 'some creatures I failed to record';

// Originals and daughters that have found their feet; everything else is noise.

  if (!sp) return false;
  return sp.parentId == null || memo.announced.has(sp.id)
    || (sp.peakPopulation || 0) >= ESTABLISHED_PEAK || (sp.totalBorn || 0) >= ESTABLISHED_BORN;

// Introduced in the journal already (or an original), so it can be named in other lines.

  return !!sp && (sp.parentId == null || memo.announced.has(sp.id));

function findCreature(world, id) {
  const list = world && world.creatures;
  if (!Array.isArray(list) || id == null) return null;
  for (let i = 0; i < list.length; i++) if (list[i] && list[i].id === id) return list[i];
  return null;
}

// What sets a daughter species apart from its parent, as a sentence.
function difference(child, parent) {
  const c = child && child.pheno, p = parent && parent.pheno;
  if (!c || !p) return null;
  const options = [];
  if (p.diet < 0.5 && c.diet >= 0.5) options.push([3, 'It has acquired a taste for its neighbours.']);
  if (p.diet >= 0.5 && c.diet < 0.5) options.push([3, 'It has given up hunting for a quieter life among the algae.']);
  const size = c.radius / p.radius;
  if (size > 1.2) options.push([size - 1, 'It is noticeably larger than its forebears.']);
  if (size < 0.83) options.push([1 / size - 1, 'It is smaller and neater than its forebears.']);
  const speed = c.maxSpeed / p.maxSpeed;
  if (speed > 1.25) options.push([speed - 1, 'It is a good deal quicker.']);
  if (speed < 0.8) options.push([1 / speed - 1, 'It is altogether more leisurely.']);
  if (c.finCount > p.finCount) options.push([0.3, 'It has grown an extra pair of fins.']);
  if (c.finCount < p.finCount) options.push([0.3, 'It seems to have mislaid a pair of fins.']);
  if (c.pattern !== p.pattern) {
    const word = { spots: 'spots', stripes: 'stripes', bands: 'bands' };
    let text;
    if (p.pattern === 'plain') text = `It has taken to wearing ${word[c.pattern]}.`;
    else if (c.pattern === 'plain') text = 'It has lost its markings entirely.';
    else text = `It wears ${word[c.pattern]} where its ancestors wore ${word[p.pattern]}.`;
    options.push([0.45, text]);

  if (dh > 60) options.push([dh / 300, 'It is a different colour altogether.']);
  if (c.tailLength / p.tailLength > 1.3) options.push([0.35, 'It sports a longer, showier tail.']);
  if (c.senseRange / p.senseRange > 1.3) options.push([0.35, 'Its senses are notably keener.']);
  if (!options.length) return null;

// ---------- event narrators ----------
function announce(event, world, memo, D, sp) {
  memo.announced.add(sp.id);
  const parent = speciesOf(world, sp.parentId);
  const first = memo.speciations === 0;
  memo.speciations++;
  const S = full(sp);
  const since = sp.founderTick != null && dayOf(sp.founderTick) < dayOf(event.tick) ? ` since day ${dayOf(sp.founderTick)}` : '';
  if (!parent) {
    return choose(event, 1, [
      `${D} A new form has settled in: ${S}, of no parentage I can trace.`,
      `${D} Added ${S} to the notebook. Its origins are a mystery to me.`,
    ]);
  }

      `${D} The pool's first new species: ${S}, split from ${full(parent)}.${extra}`,
      `${D} It has happened at last. ${capFirst(S)} has branched off from ${full(parent)}.${extra}`,

    `${D} A new form has appeared: ${S}, descended from the ${commonOf(parent)}.`,
    `${D} Some of the ${commonPlural(parent)} have drifted far enough from their kin to earn a name of their own: ${S}.`,
    `${D} I am now fairly sure ${S} is its own species, an offshoot of the ${commonOf(parent)}.${extra}`,
    `${D} Entered a new species in the notebook: ${S}, daughter of the ${commonOf(parent)}.${extra}`,
    `${D} ${capFirst(S)} has been breeding true${since}; a new branch off the ${commonOf(parent)}.`,
  ]);

function speciation(event, world, memo, D) {

  // speciation after tick 0 means the world restocked an empty pool.

  memo.restockTick = event.tick;

  if (sp) memo.announced.add(sp.id);
  return choose(event, 17, [
    `${D} The pool had emptied entirely. New stock has drifted in, ${nameOrStrangers(sp)} among them.`,
    `${D} Nothing was left alive, and then, as if on cue, fresh arrivals: ${nameOrStrangers(sp)} and others.`,
  ]);

const nameOrStrangers = (sp) => (sp ? full(sp) : 'strangers');

        `${D} Another ${numberWord(n)} fleeting forms have come and gone without my managing to sketch one. The latest was ${full(sp)}.`,
        `${D} The pool keeps trying out new shapes and discarding them; ${numberWord(n)} more short-lived offshoots since I last counted.`,
        `${D} Tallied ${numberWord(n)} would-be species that never got going. The pool is a harsh editor.`,

      `${D} ${capFirst(S)} came and went in ${dur}, before I had properly sketched it.`,
      `${D} A brief experiment, ${S}: gone after ${dur}, never more than ${numberWord(peak)}.`,
    ]);

    line = choose(event, 5, [
      `${D} The last ${commonOf(sp)} (${latinOf(sp)}) is gone. It lasted ${dur} and never numbered more than ${peak}.`,
      `${D} No ${commonPlural(sp)} left in the pool. ${capFirst(dur)} from first sighting to last; at their height there were ${peak}.`,
      `${D} I have stopped looking for ${S}; it is extinct. A run of ${dur}, peaking at ${peak}.`,
      peak >= 20
        ? `${D} ${capFirst(S)} has died out after ${dur}. ${capFirst(numberWord(peak))} at its peak, which is a respectable showing.`
        : `${D} ${capFirst(S)} has died out after ${dur}. It never managed more than ${numberWord(peak)}.`,
      `${D} Struck ${S} from the list of the living. ${capFirst(dur)}, and at best ${numberWord(peak)} of them.`,

function milestone(event, world, memo, D) {

  const done = memo.milestones.get(event.speciesId) || 0;
  if (pop <= done) return null;

      `${D} ${capFirst(S)} now number ${w}. At this point they are less a species than a weather system.`,
      `${D} Over ${w} ${Pl} today. The pool is starting to look like theirs.`,
      `${D} I counted ${w} ${Pl} before giving up and calling it ${w}.`,
    ]);

    `${D} ${capFirst(S)} now number ${w}, a new high.`,
    `${D} Counted ${w} ${Pl} today; they are doing well for themselves.`,
    predator
      ? `${D} ${capFirst(S)} have reached ${w}. Their prey may have opinions about this.`
      : `${D} ${capFirst(S)} have reached ${w}. The algae may have opinions about this.`,

const KILL_MARKS = [10, 20, 35, 50, 75, 100, 150, 200];

function predation(event, world, memo, D) {
  const predSp = event.predatorSpecies, preySp = event.preySpecies;
  const pred = speciesOf(world, predSp), prey = speciesOf(world, preySp);
  const pc = commonOf(pred), yc = commonOf(prey);

    if (preySp != null) memo.preySeen.add(preySp);
    return choose(event, 8, [
      `${D} The first kill I have witnessed in the pool: ${full(pred)} took ${withArticle(yc)}.`,
      `${D} So it begins. ${capFirst(withArticle(pc))} (${latinOf(pred)}) has eaten ${withArticle(yc)}, and the pool is a little less innocent.`,
    ]);

    if (memo.cannibalSeen.has(predSp) || !known(pred, memo)) return null;
    memo.cannibalSeen.add(predSp);
    if (quiet) return null;
    memo.firstsTick = event.tick || 0;
    return choose(event, 9, [
      `${D} ${capFirst(withArticle(pc))} ate one of its own. Hunger makes poor manners.`,
      `${D} Cannibalism among ${fullPlural(pred)}. I will assume times are hard.`,

      `${D} ${capFirst(fullPlural(prey))} have learned the hard way that the ${plural(pc)} are hungry.`,
      `${D} First recorded loss among ${fullPlural(prey)}: one went down to ${withArticle(pc)}.`,
    ]);

    memo.predatorSeen.add(predSp);
    if (quiet) return null;
    memo.firstsTick = event.tick || 0;
    return choose(event, 11, [
      `${D} ${capFirst(full(pred))} has made its first recorded kill, ${withArticle(yc)}.`,
      `${D} Noted: the ${plural(pc)} hunt. One was seen making off with ${withArticle(yc)}.`,
    ]);

  return choose(event, 12, [
    `${D} One ${pc} has now made ${numberWord(kills)} kills, the most of any creature I have followed.`,
    `${D} There is ${withArticle(pc)} out there with ${numberWord(kills)} kills to its name. I have started giving it a wide berth, figuratively.`,
  ]);
}

function death(event, world, memo, D) {

  const sp = speciesOf(world, event.speciesId);
  if (event.cause === 'old age') {
    const firstOld = memo.oldAgeCount === 0;
    memo.oldAgeCount++;

    const record = age > memo.oldAgeRecord * 1.03 && age >= 0.85 * memo.maxAgeSeen
      && (event.tick || 0) - memo.oldAgeRecordTick >= TICKS_PER_DAY / 2;

      memo.oldAgeRecordTick = event.tick || 0;
      const c = commonOf(sp), a = duration(age);
      if (firstOld) {
        return choose(event, 13, [
          `${D} ${capFirst(withArticle(c))} died of old age at ${a}, the first in the pool to simply run out of years.`,
          `${D} The first death from old age: ${withArticle(c)} (${latinOf(sp)}), aged ${a}.`,
        ]);
      }
      return choose(event, 14, [
        `${D} The oldest creature I have yet recorded, ${withArticle(c)} of ${a}, died quietly today.`,
        `${D} A venerable ${c} has died at ${a}. Nothing in the pool has lived longer.`,
        `${D} Old age took ${withArticle(c)} today, at a remarkable ${a}.`,
      ]);
    }
  }
  return crashCheck(event, memo, D, sp);

// Populations are only updated at census, so checking on deaths is cheap and timely enough.

function crashLine(event, sp, from, to, ticks, D) {

    `${D} The ${Pl} have crashed, from ${from} to ${to} in ${duration(ticks)}.`,
    `${D} Hard times for ${fullPlural(sp)}: barely ${numberWord(to)} remain of the ${numberWord(from)} I counted recently.`,
    `${D} Something has gone wrong for the ${Pl}. ${capFirst(numberWord(to))} left, down from ${from}.`,
  ]);

const GENERATIONS = [10, 25, 50, 100, 150, 200, 300, 500, 750, 1000];

    `${D} The oldest lineages in the pool now run to ${reached} generations.`,
    `${D} Somewhere in the pool, a ${ordinal(reached)}-generation hatchling. The founders would hardly know it.`,
    `${D} Generation ${reached}. I have long since stopped drawing family trees.`,

    return handler ? handler(event, world, memo, D) : null;

    return null;
  }

    }
  }
  const patL = l > 56 ? l - 28 : l + 20;
  L = {
    r, rx, ry, predator,
    tl: p.tailLength * r,
    fins: p.finCount,
    pattern: p.pattern,
    spots: new Float32Array(spots),
    bars: p.pattern === 'stripes' ? 3 + Math.floor(rand() * 3) : 2,
    front: predator ? rx * 1.32 : rx,
    // energy-level variants: well fed, hungry, starving (desaturated, dimmer)
    body: [hsla(h, s, l, 1), hsla(h, s * 0.7, l * 0.93, 1), hsla(h, s * 0.42, l * 0.84, 1)],
    sheen: hsla(h, s * 0.75, Math.min(90, l + 18), 0.42),
    rim: predator ? hsla(h, Math.min(95, s + 5), l * 0.32, 0.95) : hsla(h, s * 0.8, l * 0.55, 0.55),
    pat: hsla(ph, Math.min(95, s + 8), patL, 0.82),
    fin: hsla((h * 0.5 + ph * 0.5 + (Math.abs(h - ph) > 180 ? 180 : 0)) % 360, s * 0.85, Math.min(82, l + 10), 0.5),
    tail: hsla(h, s * 0.9, l * 0.86, 0.88),
    pupil: predator ? '#2a0606' : '#071318',
    spr: [null, null, null], // cached body sprites per energy level
  };
  looks.set(p, L);
  return L;
}

function bodyPath(ctx, L) {
  const rx = L.rx, ry = L.ry;
  ctx.beginPath();
  if (L.predator) {
    // pointed snout: the front half tapers to a tip ahead of the ellipse
    ctx.moveTo(rx * 1.32, 0);
    ctx.bezierCurveTo(rx * 1.0, ry * 0.5, rx * 0.55, ry * 1.02, -rx * 0.1, ry);
    ctx.bezierCurveTo(-rx * 0.7, ry * 0.98, -rx, ry * 0.55, -rx, 0);
    ctx.bezierCurveTo(-rx, -ry * 0.55, -rx * 0.7, -ry * 0.98, -rx * 0.1, -ry);
    ctx.bezierCurveTo(rx * 0.55, -ry * 1.02, rx * 1.0, -ry * 0.5, rx * 1.32, 0);
    ctx.closePath();
  } else {
    ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
  }
}

// Forked tail in the creature's own frame; swing bends it sideways. Always drawn
// live (it's the animated part), body and fins can come from a cached sprite.
function drawTail(ctx, L, swing) {
  const rx = L.rx, ry = L.ry;
  const tl = L.tl, bx = -rx * 0.8;
  const tipX = bx - tl * Math.cos(swing * 0.6), tipY = Math.sin(swing) * tl * 0.9;
  const midX = bx - tl * 0.5, midY = tipY * 0.35;
  const w = ry * 0.6 + tl * 0.32;
  ctx.fillStyle = L.tail;
  ctx.beginPath();
  ctx.moveTo(bx, -ry * 0.36);
  ctx.quadraticCurveTo(midX, midY - ry * 0.14, tipX, tipY - w);
  ctx.lineTo(tipX + tl * 0.22, tipY);
  ctx.lineTo(tipX, tipY + w);
  ctx.quadraticCurveTo(midX, midY + ry * 0.14, bx, ry * 0.36);
  ctx.closePath();
  ctx.fill();
}

// Tail + body in the creature's frame (+x = heading). detail: 1 = silhouette, 2 = full.
// px = world units per screen pixel, for hairline widths.
function drawLocal(ctx, L, swing, flap, level, detail, px) {
  drawTail(ctx, L, swing);
  drawBody(ctx, L, flap, level, detail, px);
}

function drawBody(ctx, L, flap, level, detail, px) {
  const rx = L.rx, ry = L.ry, r = L.r;

  if (detail > 1 && L.fins > 0) {
    ctx.fillStyle = L.fin;
    ctx.beginPath();
    const n = L.fins;
    for (let i = 0; i < n; i++) {
      const fx = rx * (0.35 - (0.95 * i) / Math.max(1, n - 0.5));
      const len = r * (0.62 - i * 0.07);
      const a = 0.8 + flap * (0.28 + i * 0.05);
      const ca = Math.cos(a), sn = Math.sin(a);
      for (let sgn = -1; sgn <= 1; sgn += 2) {
        const ax = fx, ay = sgn * ry * 0.72;
        const cx = ax - ca * len * 0.5, cy = ay + sgn * sn * len * 0.5;
        const rot = sgn * (Math.PI - a);
        ctx.moveTo(cx + Math.cos(rot) * len * 0.5, cy + Math.sin(rot) * len * 0.5);
        ctx.ellipse(cx, cy, len * 0.5, len * 0.2, rot, 0, TAU);
      }
    }
    ctx.fill();
  }

  bodyPath(ctx, L);
  ctx.fillStyle = L.body[level];
  ctx.fill();

  if (detail > 1) {
    if (L.pattern !== 'plain') {
      ctx.save();
      ctx.clip();
      ctx.fillStyle = L.pat;
      ctx.beginPath();
      if (L.pattern === 'spots') {
        const sp = L.spots;
        for (let i = 0; i < sp.length; i += 3) {
          ctx.moveTo(sp[i] + sp[i + 2], sp[i + 1]);
          ctx.arc(sp[i], sp[i + 1], sp[i + 2], 0, TAU);
        }
      } else if (L.pattern === 'stripes') {
        const n = L.bars, step = (rx * 1.7) / n, bw = Math.max(step * 0.28, px);
        for (let i = 0; i < n; i++) ctx.rect(rx * 0.75 - step * (i + 0.5) - bw / 2, -ry, bw, ry * 2);
      } else {
        // bands: two broad saddles across the back
        ctx.rect(rx * 0.12, -ry, rx * 0.34, ry * 2);
        ctx.rect(-rx * 0.62, -ry, rx * 0.3, ry * 2);
      }
      ctx.fill();
      ctx.restore();
    }
    // dorsal sheen gives the body some volume
    ctx.fillStyle = L.sheen;
    ctx.beginPath();
    ctx.ellipse(rx * 0.06, -ry * 0.12, rx * 0.58, ry * 0.32, 0, 0, TAU);
    ctx.fill();
    bodyPath(ctx, L);
  }

  ctx.lineWidth = L.predator ? Math.max(px * 1.3, r * 0.09) : Math.max(px, r * 0.06);
  ctx.strokeStyle = L.rim;
  ctx.stroke();

  if (detail > 1) {
    const ex = L.predator ? rx * 0.74 : rx * 0.58, ey = ry * 0.44;
    const er = Math.max(px * 0.9, r * 0.17);
    ctx.fillStyle = '#eef6f2';
    ctx.beginPath();
    ctx.moveTo(ex + er, ey); ctx.arc(ex, ey, er, 0, TAU);
    ctx.moveTo(ex + er, -ey); ctx.arc(ex, -ey, er, 0, TAU);
    ctx.fill();
    ctx.fillStyle = L.pupil;
    ctx.beginPath();
    const pr = er * 0.58, po = er * 0.3;
    ctx.moveTo(ex + po + pr, ey); ctx.arc(ex + po, ey, pr, 0, TAU);
    ctx.moveTo(ex + po + pr, -ey); ctx.arc(ex + po, -ey, pr, 0, TAU);
    ctx.fill();
  }
}

// Body + fins + pattern + eyes pre-rendered at `res` device px per world unit.
// Path filling and clipping per creature is what costs at 400 creatures; a rotated
// drawImage is nearly free, so only the tail is drawn as a live path.
function spriteFor(L, level, res) {
  let sp = L.spr[level];
  if (sp && sp.res === res) return sp;
  const pad = 2 / res;
  const x0 = -L.rx - L.r * 0.35 - pad, x1 = L.front + pad;
  const hh = Math.max(L.ry, L.ry * 0.72 + L.r * 0.78) + pad;
  const w = Math.max(1, Math.ceil((x1 - x0) * res)), h = Math.max(1, Math.ceil(hh * 2 * res));
  if (!sp) { sp = { c: makeCanvas(w, h), res: 0, x: 0, y: 0, w: 0, h: 0 }; L.spr[level] = sp; }
  else { sp.c.width = w; sp.c.height = h; } // resizing also clears it
  const g = sp.c.getContext('2d');
  g.setTransform(res, 0, 0, res, -x0 * res, hh * res);
  drawBody(g, L, 0, level, L.r * res >= 5 ? 2 : 1, 1 / res);
  sp.res = res; sp.x = x0; sp.y = -hh; sp.w = w / res; sp.h = h / res;
  return sp;
}

// Field-guide picture: the creature facing right, fitted into a size x size box centred on (x, y).
function drawPortrait(ctx, pheno, x, y, size) {
  const L = lookFor(pheno);
  const back = L.rx * 0.8 + L.tl * 1.05;
  const halfH = Math.max(L.ry + (L.fins > 0 ? L.r * 0.62 : 0), L.ry * 0.6 + L.tl * 0.32 + L.tl * 0.1);
  const k = (size * 0.92) / Math.max(L.front + back, halfH * 2);
  ctx.save();
  ctx.translate(x + ((back - L.front) / 2) * k, y);
  ctx.scale(k, k);
  drawLocal(ctx, L, 0.22, 0.25, 0, 2, 1 / k);
  ctx.restore();
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

// Soft radial sprite drawn with additive blending; avoids creating gradients per frame.
function glowSprite(size, stops) {
  const c = makeCanvas(size, size), g = c.getContext('2d');
  const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, col] of stops) grad.addColorStop(o, col);
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  return c;
}

// Tileable caustic network: integer frequencies + periodic warps keep the tile seamless.
function causticTile(n) {
  const c = makeCanvas(n, n), g = c.getContext('2d');
  const img = g.createImageData(n, n), d = img.data;
  for (let j = 0; j < n; j++) {
    for (let i = 0; i < n; i++) {
      const a = (TAU * i) / n, b = (TAU * j) / n;
      const w1 = 0.6 * Math.sin(a + 2 * b) + 0.4 * Math.cos(2 * a - b);
      const w2 = 0.5 * Math.cos(a - 2 * b + 1) + 0.4 * Math.sin(3 * b + a);
      const f = Math.sin(2 * a + w1 * 2) + Math.sin(2 * b + w2 * 2) + Math.sin(a + b + w1 + w2 + 0.7);
      const v = Math.exp(-f * f * 3.2);
      const k = (j * n + i) * 4;
      d[k] = 200; d[k + 1] = 255; d[k + 2] = 238; d[k + 3] = Math.round(255 * v * v);
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

// Static pool floor, rendered once per world size at reduced resolution.
function makeBackdrop(W, H) {
  const k = Math.min(1, 1100 / Math.max(W, H));
  const c = makeCanvas(Math.round(W * k), Math.round(H * k)), g = c.getContext('2d');
  g.scale(k, k);
  const base = g.createRadialGradient(W * 0.45, H * 0.4, 0, W * 0.5, H * 0.5, Math.hypot(W, H) * 0.62);
  base.addColorStop(0, '#1d6a6c');
  base.addColorStop(0.45, '#124d58');
  base.addColorStop(1, '#06283a');
  g.fillStyle = base;
  g.fillRect(0, 0, W, H);
  // mottled floor: soft sand patches and darker weed beds
  const rand = lcg(7);
  for (let i = 0; i < 46; i++) {
    const x = rand() * W, y = rand() * H, r = 40 + rand() * 170;
    const light = rand() < 0.45;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, light ? 'rgba(120, 170, 140, 0.10)' : 'rgba(2, 24, 30, 0.22)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    g.fillStyle = grad;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // pebbles, very faint, so the floor reads as a floor when zoomed in
  for (let i = 0; i < 260; i++) {
    const x = rand() * W, y = rand() * H, r = 1.5 + rand() * 4;
    g.fillStyle = rand() < 0.5 ? 'rgba(160, 200, 180, 0.05)' : 'rgba(0, 20, 25, 0.12)';
    g.beginPath(); g.ellipse(x, y, r * 1.3, r, rand() * 3, 0, TAU); g.fill();
  }
  // shaded walls: the pool gets darker toward its rocky rim
  const edge = Math.min(W, H) * 0.16;
  const sides = [[0, 0, edge, 0, 0, 0, edge, H], [W, 0, W - edge, 0, W - edge, 0, edge, H],
    [0, 0, 0, edge, 0, 0, W, edge], [0, H, 0, H - edge, 0, H - edge, W, edge]];
  for (const [x0, y0, x1, y1, rx, ry, rw, rh] of sides) {
    const grad = g.createLinearGradient(x0, y0, x1, y1);
    grad.addColorStop(0, 'rgba(1, 14, 22, 0.75)');
    grad.addColorStop(0.35, 'rgba(1, 14, 22, 0.25)');
    grad.addColorStop(1, 'rgba(1, 14, 22, 0)');
    g.fillStyle = grad;
    g.fillRect(rx, ry, rw, rh);
  }
  return c;
}

function createRenderer(canvas) {
  const ctx = canvas.getContext('2d', { alpha: false });
  let dpr = 1, cw = 1, ch = 1; // CSS size
  let backdrop = null, bdW = 0, bdH = 0;
  let vignette = null;
  let lastNow = 0, waterT = 0, creatureT = 0, lastTick = -1;
  const caustic = causticTile(256);
  let causticPat = null;
  const lightSprite = glowSprite(128, [[0, 'rgba(255, 214, 140, 1)'], [0.3, 'rgba(255, 178, 96, 0.62)'], [0.65, 'rgba(236, 140, 80, 0.16)'], [1, 'rgba(236, 140, 80, 0)']]);
  const glint = glowSprite(32, [[0, 'rgba(255, 252, 210, 1)'], [0.2, 'rgba(226, 238, 128, 0.95)'], [0.5, 'rgba(150, 206, 84, 0.32)'], [1, 'rgba(120, 190, 70, 0)']]);
  const snow = new Float32Array(SNOW_COUNT * 4); // x, y, size, alpha-ish depth
  let snowW = 0, snowH = 0;
  const dash = [4, 6];
  const ghost = { x: 0, y: 0, r: 0, until: 0 };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight);
    if (w === cw && h === ch && canvas.width === Math.round(w * dpr)) return false;
    cw = w; ch = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    const v = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.hypot(w, h) * 0.6);
    v.addColorStop(0, 'rgba(0, 8, 14, 0)');
    v.addColorStop(1, 'rgba(0, 8, 14, 0.42)');
    vignette = v;
    return true;
  }

  function ensureWorldAssets(world) {
    if (!backdrop || bdW !== world.width || bdH !== world.height) {
      bdW = world.width; bdH = world.height;
      backdrop = makeBackdrop(bdW, bdH);
    }
    if (!causticPat) causticPat = ctx.createPattern(caustic, 'repeat');
    if (snowW !== world.width || snowH !== world.height) {
      snowW = world.width; snowH = world.height;
      const rand = lcg(99);
      for (let i = 0; i < SNOW_COUNT; i++) {
        snow[i * 4] = rand() * snowW;
        snow[i * 4 + 1] = rand() * snowH;
        snow[i * 4 + 2] = 0.6 + rand() * 1.6;
        snow[i * 4 + 3] = rand();
      }
    }
  }

  function screenToWorld(view, sx, sy) {
    return { x: sx / view.scale + view.ox, y: sy / view.scale + view.oy };
  }

  function fitView(world) {
    resize();
    const scale = Math.min(cw / world.width, ch / world.height) * 0.97;
    return { scale, ox: world.width / 2 - cw / (2 * scale), oy: world.height / 2 - ch / (2 * scale) };
  }

  function drawCaustics(S, ex, ey, x0, y0, x1, y1, t) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = causticPat;
    for (let layer = 0; layer < 2; layer++) {
      const k = layer === 0 ? 3.4 : 2.3; // world units per texel
      const offX = layer === 0 ? t * 7 : -t * 5 + 90;
      const offY = layer === 0 ? t * 4 : t * 6.5 + 40;
      ctx.globalAlpha = layer === 0 ? 0.06 : 0.045;
      // the pattern is anchored to the transform origin, so shifting the origin scrolls it
      ctx.setTransform(S * k, 0, 0, S * k, ex + offX * S, ey + offY * S);
      ctx.fillRect((x0 - offX) / k, (y0 - offY) / k, (x1 - x0) / k, (y1 - y0) / k);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function draw(world, view, selectedId) {
    resize();
    ensureWorldAssets(world);
    const now = performance.now();
    const dt = lastNow ? Math.min(0.1, (now - lastNow) / 1000) : 0;
    lastNow = now;
    waterT += dt;
    // creatures only animate while the simulation advances, so pause freezes them
    if (world.tick !== lastTick) { creatureT += dt; lastTick = world.tick; }

    const W = world.width, H = world.height;
    const scale = view.scale, S = scale * dpr;
    const ex = -view.ox * S, ey = -view.oy * S;
    const px = 1 / scale;
    // sprite resolution snapped to powers of two so zooming rarely re-renders them
    const res = Math.min(32, Math.max(0.25, 2 ** Math.ceil(Math.log2(S))));
    // visible world rect (with margin) for culling
    const vx0 = view.ox - 30, vy0 = view.oy - 30;
    const vx1 = view.ox + cw / scale + 30, vy1 = view.oy + ch / scale + 30;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#020d12';
    ctx.fillRect(0, 0, cw, ch);

    ctx.setTransform(S, 0, 0, S, ex, ey);
    // rocky rim around the pool
    ctx.fillStyle = '#0a1d22';
    ctx.fillRect(-14, -14, W + 28, H + 28);
    ctx.drawImage(backdrop, 0, 0, W, H);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.clip();

    // sunlit patches: warm additive glows
    ctx.globalCompositeOperation = 'lighter';
    const lights = world.lights || [];
    for (let i = 0; i < lights.length; i++) {
      const lt = lights[i];
      const rr = lt.r * 1.5 * (1 + 0.04 * Math.sin(waterT * 0.7 + i * 1.9));
      ctx.globalAlpha = 0.26 + 0.05 * Math.sin(waterT * 0.5 + i);
      ctx.drawImage(lightSprite, lt.x - rr, lt.y - rr, rr * 2, rr * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    const cx0 = Math.max(0, vx0), cy0 = Math.max(0, vy0), cx1 = Math.min(W, vx1), cy1 = Math.min(H, vy1);
    if (cx1 > cx0 && cy1 > cy0) drawCaustics(S, ex, ey, cx0, cy0, cx1, cy1, waterT);
    ctx.setTransform(S, 0, 0, S, ex, ey);

    // algae glints
    ctx.globalCompositeOperation = 'lighter';
    const food = world.food;
    const gs = Math.max(5.5, 4.5 * px), gh = gs / 2;
    for (let i = 0; i < food.length; i++) {
      const f = food[i];
      if (f.x < vx0 || f.x > vx1 || f.y < vy0 || f.y > vy1) continue;
      ctx.globalAlpha = 0.5 + 0.4 * Math.sin(waterT * 2.3 + f.x * 0.37 + f.y * 0.61);
      ctx.drawImage(glint, f.x - gh, f.y - gh, gs, gs);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    const creatures = world.creatures;
    let sel = null;

    // soft shadows on the floor, one path for all of them
    ctx.fillStyle = SHADOW;
    ctx.beginPath();
    for (let i = 0; i < creatures.length; i++) {
      const c = creatures[i];
      if (c.x < vx0 || c.x > vx1 || c.y < vy0 || c.y > vy1) continue;
      const L = lookFor(c.pheno);
      if (L.r * scale < 1.8) continue;
      const off = L.r * 0.45;
      const sx = c.x + off, sy = c.y + off * 1.4;
      ctx.moveTo(sx + Math.cos(c.angle) * L.rx, sy + Math.sin(c.angle) * L.rx);
      ctx.ellipse(sx, sy, L.rx, L.ry, c.angle, 0, TAU);
    }
    ctx.fill();

    for (let i = 0; i < creatures.length; i++) {
      const c = creatures[i];
      if (c.id === selectedId) sel = c;
      if (c.x < vx0 || c.x > vx1 || c.y < vy0 || c.y > vy1) continue;
      const p = c.pheno;
      const L = lookFor(p);
      const e = c.energy / p.maxEnergy;
      const level = e > 0.4 ? 0 : e > 0.18 ? 1 : 2;
      const onScreen = L.r * scale;
      if (onScreen < 1.3) {
        ctx.fillStyle = L.body[level];
        ctx.beginPath();
        ctx.arc(c.x, c.y, Math.max(L.r, 1.2 * px), 0, TAU);
        ctx.fill();
        continue;
      }
      const out = c.outputs;
      const thrust = out ? out[1] : 0.5, turn = out ? out[0] : 0;
      const swing = Math.sin(c.phase + creatureT * 7.5) * (0.1 + 0.5 * thrust) - turn * 0.35;
      const flap = Math.sin(c.phase * 1.7 + creatureT * 4.2);
      const cs = Math.cos(c.angle) * S, sn = Math.sin(c.angle) * S;
      ctx.setTransform(cs, sn, -sn, cs, c.x * S + ex, c.y * S + ey);
      if (onScreen > SPRITE_MAX_PX) {
        drawLocal(ctx, L, swing, flap, level, 2, px);
      } else {
        if (onScreen >= 1.8) drawTail(ctx, L, swing);
        const sp = spriteFor(L, level, res);
        ctx.drawImage(sp.c, sp.x, sp.y, sp.w, sp.h);
      }
    }
    ctx.setTransform(S, 0, 0, S, ex, ey);

    // marine snow drifting above everything, for depth
    const drift = dt * 4;
    ctx.fillStyle = 'rgba(214, 238, 232, 0.16)';
    ctx.beginPath();
    for (let i = 0; i < SNOW_COUNT; i++) {
      const o = i * 4;
      let x = snow[o] + drift * (0.6 + snow[o + 3]) + Math.sin(waterT * 0.3 + i) * 0.05;
      let y = snow[o + 1] + drift * 0.45 * (0.5 + snow[o + 3]);
      if (x > W) x -= W;
      if (y > H) y -= H;
      snow[o] = x; snow[o + 1] = y;
      if (x < vx0 || x > vx1 || y < vy0 || y > vy1) continue;
      const s = Math.max(snow[o + 2], 0.9 * px);
      ctx.rect(x, y, s, s);
    }
    ctx.fill();
    ctx.restore(); // pool clip

    ctx.setTransform(S, 0, 0, S, ex, ey);
    if (sel) {
      const L = lookFor(sel.pheno);
      ghost.x = sel.x; ghost.y = sel.y; ghost.r = L.rx; ghost.until = now + 2200;
      const pulse = 1 + 0.06 * Math.sin(waterT * 3);
      ctx.lineWidth = 1.5 * px;
      ctx.strokeStyle = 'rgba(255, 238, 196, 0.9)';
      ctx.beginPath();
